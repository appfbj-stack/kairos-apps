services:
  web:
    build: .
    container_name: kairos-apps-landing
    restart: unless-stopped
    ports:
      - "3012:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3